<script>

const now = () => Math.floor(Date.now() / 1000);

];

const LS_KEY = 'permisoC.v1';
const Store = {

      this.remote = ref;
      try { localStorage.setItem(LS_KEY, JSON.stringify(this.s)); } catch (e) {}
      if (!theirs || Object.keys(this.s.q).length > Object.keys(theirs.q || {}).length || (this.s.ts || 0) > (theirs.ts || 0)) this.push();
      applyAccent();
      if (changed && View.cur && View.cur.name !== 'test') View.refresh();
      synced = true; if (View.cur && View.cur.name === 'home') View.refresh();
    } catch (e) {}
  },
  reset() {
    this.s = { q: {}, t: {}, opt: this.s.opt, ts: now() };
    this.save();
  }
};
let synced = false;

const st = id => Store.s.q[id] || [0, 0, 0, 0, 0];
function record(id, ok) {
  const e = st(id).slice();
  e[0]++;
  if (ok) { e[2]++; if (e[3] && e[2] >= 2) e[3] = 0; }
  else { e[1]++; e[2] = 0; e[3] = 1; }
  e[4] = now();
  Store.s.q[id] = e;
  Store.save();
}
const errorIds = () => Object.keys(Store.s.q).filter(id => Store.s.q[id][3] && Q.has(id));

function topicStats() {
  const rows = D.topics.map((name, i) => ({ i, name, seen: 0, fails: 0, pend: 0, total: 0 }));
  for (const q of D.questions) rows[q.tp].total++;
  for (const [id, e] of Object.entries(Store.s.q)) {
    const q = Q.get(id); if (!q) continue;
    const r = rows[q.tp]; r.seen += e[0]; r.fails += e[1]; r.pend += e[3] ? 1 : 0;
  }
  rows.forEach(r => r.rate = r.seen ? r.fails / r.seen : 0);
  return rows;
}

// ---------- imágenes ----------
const imgCache = new Map();
const packCache = new Map();
async function imgSrc(name) {
  if (!name) return '';
  if (imgCache.has(name)) return imgCache.get(name);
  const pk = D.imgPack && D.imgPack[name];
  if (pk === undefined) return 'img/' + name;
  if (!packCache.has(pk)) packCache.set(pk, loadJSON('img/pack-' + pk + '.json'));
  try {
    const pack = await packCache.get(pk);
    const src = pack[name] || '';
    imgCache.set(name, src);
    return src;
  } catch (e) { packCache.delete(pk); return ''; }
}
function prefetchImgs(ids) { ids.forEach(id => { const q = Q.get(id); if (q && q.img) imgSrc(q.img); }); }
function fixHtmlImgs(root) {
  root.querySelectorAll('img[data-img]').forEach(async im => { im.src = await imgSrc(im.dataset.img); });
}

// ---------- vistas ----------
const app = $('#app');
const View = {
  stack: [], cur: null,
  go(name, arg, replace) { if (this.cur && !replace) this.stack.push(this.cur); this.cur = { name, arg }; this.draw(); },
  back() { this.cur = this.stack.pop() || { name: 'home' }; this.draw(); },
  home() { this.stack = []; this.cur = { name: 'home' }; this.draw(); },
  refresh() { this.draw(); },
  draw() {
    document.body.classList.toggle('in-test', this.cur.name === 'test');
    const r = Views[this.cur.name](this.cur.arg);
    app.innerHTML = '';
    app.appendChild(r);
    if (this.cur.name !== 'test') window.scrollTo(0, 0);
  }
};

function barsHtml(rows, opts = {}) {

      <span class="track"><span class="fill" style="width:${Math.max(3, r.rate / max * 100)}%"></span></span>
    </button>`).join('')}</div>`;
}

  test(T) { return renderTest(T); },

function startTopicErrors(tp) {
  const ids = errorIds().filter(id => Q.get(id).tp === tp).sort((a, b) => Q.get(a).ord - Q.get(b).ord);
  if (ids.length) startTest({ title: 'Errores · ' + D.topics[tp], ids, key: null });
}
function startReview() {
  // Repaso: primero preguntas nunca vistas, luego las que hace más tiempo que no contestas; se mezclan temas.
  const unseen = shuffle(D.questions.filter(q => !Store.s.q[q.id]).map(q => q.id));
  const seen = D.questions.filter(q => Store.s.q[q.id]).map(q => q.id).sort((a, b) => st(a)[4] - st(b)[4]);
  const nNew = Math.min(unseen.length, seen.length ? Math.ceil(EXAM_SIZE / 2) : EXAM_SIZE);
  const pick = unseen.slice(0, nNew).concat(seen.slice(0, EXAM_SIZE - nNew));
  if (pick.length < EXAM_SIZE) pick.push(...unseen.slice(nNew, nNew + EXAM_SIZE - pick.length));
  startTest({ title: 'Test de repaso', ids: shuffle(pick), key: null });
}

// ---------- test ----------
function startTest({ title, ids, key }) {
  ids = ids.filter(id => Q.has(id));
  if (!ids.length) return;
  View.go('test', { title, ids, key, i: 0, ans: new Array(ids.length).fill(null), confirmExit: false });
}

function renderTest(T) {
  const el = h(`<div class="test">
    <div class="t-head">
      <button class="back" data-act="exit" aria-label="Salir del test">✕</button>
      <div class="title"><b>${esc(T.title)}</b><span id="t-pos"></span></div>
      <div class="score"><span class="o" id="t-ok"></span><span class="x" id="t-ko"></span></div>
    </div>
    <div class="segs" id="t-segs">${T.ids.map(() => '<i></i>').join('')}</div>
    <div id="t-exit" hidden></div>
    <div class="stage" id="t-stage">
      <span class="ghost-dir l" aria-hidden="true">A</span><span class="ghost-dir r" aria-hidden="true">B</span><span class="ghost-dir d" aria-hidden="true">C</span>
    </div>
    <div class="t-foot" id="t-foot"></div>
  </div>`);
  const stage = $('#t-stage', el), foot = $('#t-foot', el);
  const ghosts = { 0: $('.ghost-dir.l', el), 1: $('.ghost-dir.r', el), 2: $('.ghost-dir.d', el) };
  let card = null;

  function header() {
    const ok = T.ans.filter((a, k) => a !== null && a === Q.get(T.ids[k]).a).length;
    const ko = T.ans.filter(a => a !== null).length - ok;
    $('#t-pos', el).textContent = `Pregunta ${T.i + 1} de ${T.ids.length}`;
    $('#t-ok', el).textContent = '✓' + ok;
    $('#t-ko', el).textContent = '✗' + ko;
    [...$('#t-segs', el).children].forEach((s, k) => {
      s.className = T.ans[k] === null ? (k === T.i ? 'cur' : '') : (T.ans[k] === Q.get(T.ids[k]).a ? 'ok' : 'bad');
    });
  }

  function showCard(enter) {
    const q = Q.get(T.ids[T.i]);
    const answered = T.ans[T.i] !== null;
    card = h(`<article class="card ${enter ? 'enter' : ''}" tabindex="-1">
      <div class="body">
        ${q.img ? `<div class="pic"><div class="ph"></div></div>` : ''}
        <div class="qtext"><span class="n">${T.i + 1}.</span>${q.t}</div>
        <div class="opts">${q.o.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${LETTERS[k]}<small>${DIRS[k]}</small></span><span>${o}</span></button>`).join('')}</div>
      </div>
    </article>`);
    stage.querySelectorAll('.card').forEach(c => c.remove());
    stage.appendChild(card);
    fixHtmlImgs(card);
    if (q.img) imgSrc(q.img).then(src => {
      const pic = $('.pic', card); if (!pic || !src) { pic && pic.remove(); return; }
      const im = new Image(); im.alt = 'Imagen de la pregunta'; im.src = src; im.draggable = false;
      im.onclick = e => { e.stopPropagation(); zoom(src); };
      pic.innerHTML = ''; pic.appendChild(im);
    });
    card.querySelectorAll('.opt').forEach(b => b.onclick = e => { e.stopPropagation(); if (!moved) answer(+b.dataset.k); });
    bindSwipe(card);
    prefetchImgs(T.ids.slice(T.i + 1, T.i + 3));
    if (answered) paintAnswer(false);
    header(); renderFoot();
  }

  function paintAnswer() {
    const q = Q.get(T.ids[T.i]), a = T.ans[T.i];
    card.querySelectorAll('.opt').forEach(b => {
      const k = +b.dataset.k; b.classList.remove('hot');
      if (k === q.a) b.classList.add('right'); else if (k === a) b.classList.add('wrong');
    });
  }

  function renderFoot() {
    const q = Q.get(T.ids[T.i]), a = T.ans[T.i];
    const last = T.i === T.ids.length - 1;
    if (a === null) {
      foot.innerHTML = `<span class="hint">← A &nbsp;·&nbsp; B → &nbsp;·&nbsp; ↓ C</span>`;
    } else {
      const ok = a === q.a;
      foot.innerHTML = `<span class="verdict ${ok ? 'ok' : 'bad'}">${ok ? '¡Correcta!' : 'Era la ' + LETTERS[q.a]}</span>
        ${q.h ? '<button class="btn ghost" data-help>Explicación</button>' : ''}<span class="grow"></span>
        <button class="btn" data-next>${last ? 'Ver resultado' : 'Siguiente ↑'}</button>`;
      const hb = $('[data-help]', foot); if (hb) hb.onclick = () => help(q);
      $('[data-next]', foot).onclick = next;
    }
  }

  let autoTimer = 0;
  function answer(k) {
    if (T.ans[T.i] !== null) return;
    const q = Q.get(T.ids[T.i]);
    if (k >= q.o.length) return;
    T.ans[T.i] = k;
    record(q.id, k === q.a);
    paintAnswer(); header(); renderFoot();
    if (navigator.vibrate) try { navigator.vibrate(k === q.a ? 15 : [30, 40, 30]); } catch (e) {}
    if (k === q.a && Store.s.opt.auto) { clearTimeout(autoTimer); autoTimer = setTimeout(() => { if (View.cur && View.cur.arg === T && T.ans[T.i] !== null) next(); }, 750); }
  }

  function next() {
    clearTimeout(autoTimer);
    if (T.ans[T.i] === null) return;
    if (T.i >= T.ids.length - 1) return finish();
    const old = card;
    old.classList.add('leave');
    setTimeout(() => old.remove(), 260);
    T.i++;
    showCard(true);
  }

  function finish() {
    clearTimeout(autoTimer);
    const ok = T.ans.filter((a, k) => a === Q.get(T.ids[k]).a).length;
    if (T.key) {
      const prev = Store.s.t[T.key] || [0, 0, 0, T.ids.length, 0];
      Store.s.t[T.key] = [prev[0] + 1, Math.max(prev[1], ok), ok, T.ids.length, now()];
      Store.save();
    }
    T.done = true;
    View.go('result', T, true);
  }

  // --- gesto de deslizar ---
  let moved = false;
  function bindSwipe(c) {
    let sx = 0, sy = 0, dx = 0, dy = 0, active = false, dir = -1, pid = null;
    const TH = 60;
    const setHot = d => {
      Object.entries(ghosts).forEach(([k, g]) => g.classList.toggle('on', +k === d));
      c.querySelectorAll('.opt').forEach(b => b.classList.toggle('hot', T.ans[T.i] === null && +b.dataset.k === d));
    };
    c.addEventListener('pointerdown', e => {
      if (e.button > 0) return;
      active = true; moved = false; pid = e.pointerId; sx = e.clientX; sy = e.clientY; dx = dy = 0; dir = -1;
      c.classList.remove('settle');
    });
    c.addEventListener('pointermove', e => {
      if (!active || e.pointerId !== pid) return;
      dx = e.clientX - sx; dy = e.clientY - sy;
      if (!moved && Math.hypot(dx, dy) > 8) { moved = true; try { c.setPointerCapture(pid); } catch (er) {} }
      if (!moved) return;
      const answered = T.ans[T.i] !== null;
      const ty = answered ? Math.min(dy, 0) : (dy > 0 ? dy : dy * 0.25);
      c.style.transform = `translate(${answered ? dx * 0.2 : dx}px, ${ty}px) rotate(${answered ? 0 : dx / 22}deg)`;
      const q = Q.get(T.ids[T.i]);
      dir = -1;
      if (!answered) {
        if (dy > TH && dy > Math.abs(dx)) dir = 2;
        else if (Math.abs(dx) > TH && Math.abs(dx) > dy) dir = dx < 0 ? 0 : 1;
        if (dir >= q.o.length) dir = -1;
        setHot(dir);
      } else {
        dir = (-dy > TH && -dy > Math.abs(dx)) ? 9 : -1;
      }
    });
    const end = e => {
      if (!active || (e && e.pointerId !== pid)) return;
      active = false;
      setHot(-1);
      c.classList.add('settle');
      c.style.transform = '';
      if (dir === 9) next();
      else if (dir >= 0) answer(dir);
      setTimeout(() => { moved = false; }, 0);
    };
    c.addEventListener('pointerup', end);
    c.addEventListener('pointercancel', end);
  }

  function onKey(e) {
    if (View.cur.arg !== T || document.querySelector('.sheet-bg, .zoom')) return;
    const answered = T.ans[T.i] !== null;
    if (!answered && e.key === 'ArrowLeft') answer(0);
    else if (!answered && e.key === 'ArrowRight') answer(1);
    else if (!answered && e.key === 'ArrowDown') answer(2);
    else if (answered && (e.key === 'ArrowUp' || e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); next(); }
    else return;
    e.preventDefault();
  }
  document.addEventListener('keydown', onKey);
  const obs = new MutationObserver(() => { if (!document.body.contains(el)) { document.removeEventListener('keydown', onKey); obs.disconnect(); clearTimeout(autoTimer); } });
  obs.observe(app, { childList: true });

  $('[data-act=exit]', el).onclick = () => {
    const box = $('#t-exit', el);
    const answeredN = T.ans.filter(a => a !== null).length;
    if (!answeredN) return View.back();
    box.hidden = !box.hidden;
    box.innerHTML = `<div class="confirm-bar"><span>¿Salir? Tus respuestas ya cuentan para errores.</span><button class="btn danger" data-y>Salir</button><button class="btn ghost" data-r>Resultado</button></div>`;
    $('[data-y]', box).onclick = () => View.back();
    $('[data-r]', box).onclick = () => {
      const keep = T.ans.map((a, k) => a !== null ? k : -1).filter(k => k >= 0);
      const T2 = { ...T, ids: keep.map(k => T.ids[k]), ans: keep.map(k => T.ans[k]), key: null, partial: true, done: true };
      View.go('result', T2, true);
    };
  };

  showCard(false);
  return el;
}

function help(q) {
  const bg = h(`<div class="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Explicación">
    <header><h2>Explicación</h2><button class="back" data-x aria-label="Cerrar">✕</button></header>
    <div class="content">${q.h}${q.pg ? `<div class="src">${esc(q.pg)}</div>` : ''}</div>
  </div></div>`);
  fixHtmlImgs(bg);
  const close = () => { bg.remove(); document.removeEventListener('keydown', k); };
  const k = e => { if (e.key === 'Escape') close(); };
  bg.onclick = e => { if (e.target === bg) close(); };
  $('[data-x]', bg).onclick = close;
  document.addEventListener('keydown', k);
  document.body.appendChild(bg);
}
function zoom(src) {
  const z = h(`<div class="zoom" role="dialog" aria-label="Imagen ampliada"><img alt="Imagen ampliada"></div>`);
  $('img', z).src = src;
  z.onclick = () => z.remove();
  document.body.appendChild(z);
}

function renderResult(T) {
  const n = T.ids.length;
  const ok = T.ans.filter((a, k) => a === Q.get(T.ids[k]).a).length;
  const ko = n - ok;
  const lim = maxFails(n);
  const pass = ko <= lim;
  const fails = T.ids.map((id, k) => ({ q: Q.get(id), a: T.ans[k] })).filter(x => x.a !== x.q.a);
  const el = h(`<div class="wrap">
    <div class="topbar"><button class="back" data-act="home" aria-label="Menú">←</button><div style="min-width:0"><h1>${esc(T.title)}</h1>${T.partial ? '<div class="note">Test sin terminar</div>' : ''}</div></div>
    <div class="result-hero">
      <span class="eyebrow">Resultado</span>
      ${n >= 10 && !T.partial ? `<span class="big ${pass ? 'ok' : 'bad'}">${pass ? 'APTO' : 'NO APTO'}</span>` : `<span class="big">${ok}/${n}</span>`}
      <p class="num"><b>${ok}</b> aciertos y <b>${ko}</b> ${ko === 1 ? 'fallo' : 'fallos'} de ${n}${n >= 10 ? ` · máximo ${lim} ${lim === 1 ? 'fallo' : 'fallos'} para aprobar` : ''}</p>
    </div>
    <div class="btns">
      ${fails.length ? '<button class="btn" data-retry>Repetir los fallos</button>' : ''}
      ${T.partial ? '' : '<button class="btn ghost" data-again>Repetir test</button>'}
      <button class="btn ghost" data-act="home">Menú</button>
    </div>
    ${fails.length ? `<section class="section"><div class="section-head"><h2>Preguntas falladas</h2></div>
      <div class="list">${fails.map((f, i) => `<div class="fail">
        <div class="q">${f.q.t}</div>
        <div class="a"><span class="lab no">${LETTERS[f.a]}</span><span class="no">${f.q.o[f.a]}</span><span class="lab yes">${LETTERS[f.q.a]}</span><span class="yes">${f.q.o[f.q.a]}</span></div>
        ${f.q.h ? `<button data-h="${i}">Ver explicación</button>` : ''}
      </div>`).join('')}</div></section>` : ''}
  </div>`);
  fixHtmlImgs(el);
  el.querySelectorAll('[data-act=home]').forEach(b => b.onclick = () => View.home());
  const r = $('[data-retry]', el); if (r) r.onclick = () => { View.stack.pop(); startTest({ title: 'Fallos · ' + T.title, ids: shuffle(fails.map(f => f.q.id)), key: null }); };
  const ag = $('[data-again]', el); if (ag) ag.onclick = () => { View.stack.pop(); startTest({ title: T.title, ids: T.key ? T.ids.slice() : shuffle(T.ids), key: T.key }); };
  el.querySelectorAll('[data-h]').forEach(b => b.onclick = () => help(fails[+b.dataset.h].q));
  return el;
}

// ---------- acceso (solo en la versión web pública: window.SITE la pone tools/build-site.js) ----------
// Las preguntas e imágenes van cifradas con AES-GCM; la clave sale del usuario y la contraseña (PBKDF2),
// así que sin ellas los archivos publicados no se pueden leer.
const KEY_LS = 'permisoC.key';
const Lock = {
  key: null,
  async derive(user, pass) {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(user.trim().toLowerCase() + '\n' + pass), 'PBKDF2', false, ['deriveKey']);
    const salt = Uint8Array.from(atob(window.SITE.salt), c => c.charCodeAt(0));
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: window.SITE.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  },
  async restore() {
    try {
      const raw = localStorage.getItem(KEY_LS);
      if (!raw) return false;
      this.key = await crypto.subtle.importKey('raw', Uint8Array.from(atob(raw), c => c.charCodeAt(0)), 'AES-GCM', true, ['decrypt']);
      return true;
    } catch (e) { return false; }
  },
  async remember() {
    try { const raw = new Uint8Array(await crypto.subtle.exportKey('raw', this.key)); localStorage.setItem(KEY_LS, btoa(String.fromCharCode(...raw))); } catch (e) {}
  },
  logout() { try { localStorage.removeItem(KEY_LS); } catch (e) {} location.reload(); },
  show(msg) {
    const el = h(`<div class="wrap"><form class="login" id="login" autocomplete="on">
      <div class="brand"><div class="plate" aria-hidden="true">C</div><div><h1>Permiso C</h1><p>Test teórico · acceso privado</p></div></div>
      <label class="field" for="lg-user"><span>Usuario</span><input id="lg-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label class="field" for="lg-pass"><span>Contraseña</span><input id="lg-pass" name="password" type="password" autocomplete="current-password" required></label>
      <label class="toggle" for="lg-rem"><span>Recordar en este dispositivo</span><input type="checkbox" id="lg-rem" checked></label>
      <p class="login-err" id="lg-err" ${msg ? '' : 'hidden'}>${msg ? esc(msg) : ''}</p>
      <button class="btn" type="submit" id="lg-go">Entrar</button>
    </form></div>`);
    app.innerHTML = ''; app.appendChild(el);
    const f = $('#login', el), err = $('#lg-err', el), go = $('#lg-go', el);
    f.addEventListener('submit', async e => {
      e.preventDefault();
      go.disabled = true; go.textContent = 'Comprobando…'; err.hidden = true;
      try {
        this.key = await this.derive($('#lg-user', el).value, $('#lg-pass', el).value);
        D = await loadJSON('data/preguntas.json');
        if ($('#lg-rem', el).checked) await this.remember();
        start();
      } catch (ex) {
        this.key = null;
        err.textContent = ex && ex.network ? 'No se ha podido conectar. Comprueba la conexión e inténtalo otra vez.' : 'Usuario o contraseña incorrectos.';
        err.hidden = false; go.disabled = false; go.textContent = 'Entrar';
      }
    });
  }
};
async function loadJSON(path) {
  let res;
  try { res = await fetch(window.SITE ? path.replace(/\.json$/, '.enc') : path); } catch (e) { e.network = true; throw e; }
  if (!res.ok) { const e = new Error('HTTP ' + res.status); e.network = true; throw e; }
  if (!window.SITE) return res.json();
  const buf = await res.arrayBuffer();
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(buf, 0, 12) }, Lock.key, new Uint8Array(buf, 12));
  return JSON.parse(new TextDecoder().decode(plain));
}

// ---------- arranque ----------
async function boot() {
  Store.load();
  applyAccent();
  if (window.SITE && !(await Lock.restore())) return Lock.show();
  try {
    D = await loadJSON('data/preguntas.json');
  } catch (e) {
    if (window.SITE && !e.network) return Lock.show('Tu sesión ha caducado. Vuelve a entrar.');
    app.innerHTML = '<div class="wrap"><div class="loading"><div><b>No se han podido cargar las preguntas.</b><p class="muted">Comprueba la conexión y recarga la página.</p></div></div></div>';
    return;
  }
  start();
}
function start() {
  D.questions.forEach((q, i) => { q.ord = i; Q.set(q.id, q); });
  View.home();
  Store.connect();
}
boot();
})();
</script>
